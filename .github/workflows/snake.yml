name: Generate Snake

on:
  # atualiza todo dia à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"
  # permite rodar na mão pela aba Actions
  workflow_dispatch:
  # roda a cada push na main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar snake (tema azul/roxo)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6d28d9&color_dots=#ebedf0,#bfdbfe,#93c5fd,#818cf8,#7c3aed
            dist/github-snake-dark.svg?color_snake=#a78bfa&color_dots=#161b22,#1e3a8a,#2563eb,#6366f1,#8b5cf6

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
